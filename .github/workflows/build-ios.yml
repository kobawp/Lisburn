name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/ios
          npm install -g @capacitor/cli

      - name: Build Web App
        run: npm run build

      - name: Add iOS Platform
        run: npx cap add ios || true

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Unsigned IPA
        run: |
          cd ios
          # Build the iOS project without code signing
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
          # Create Payload directory and move the .app bundle inside
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          mv App.app Payload/
          
          # Zip it up as an .ipa file
          zip -r app-unsigned.ipa Payload

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned.ipa
          path: ios/build/Build/Products/Release-iphoneos/app-unsigned.ipa
          retention-days: 7
